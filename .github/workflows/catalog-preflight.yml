name: Catalog preflight

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned preflight dependencies
        run: python -m pip install --requirement requirements-dev.lock
      - name: Validate the service catalog
        run: python3 tools/catalog_preflight.py
      - name: Verify invalid catalog fixtures are rejected
        run: python3 -m unittest discover --start-directory tests --pattern 'test_*.py'
